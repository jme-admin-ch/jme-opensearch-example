description:
  en:
    localisedName: JME OpenSearch Example
    shortDescription: Example of event-driven indexing and authorization-aware OpenSearch queries with jEAP.
    longDescription: >
      This example demonstrates how a resource service publishes Kafka messages, how a jEAP index writer retrieves and
      indexes SearchItems in OpenSearch, and how an inspection service performs type-safe, authorization-aware searches.
      It includes local Kafka, Schema Registry, OpenSearch, OpenSearch Dashboards and OAuth infrastructure. The portable
      application code also supports indexing decrees and decree documents emitted by the JME Process Archive example.
    features:
      - Event-driven OpenSearch indexing
      - Type-safe and authorization-aware searches
      - Local Kafka and OpenSearch infrastructure
      - Optional Process Archive integration
